# Sungrow: Helfer und Template-Sensoren für automations_sungrow.yaml und automations_preis_automatik.yaml
# Aus https://github.com/NobseVomBerg/GrabBag - MIT-Lizenz, ohne Gewähr. Entity-IDs an die eigene Anlage anpassen.
#
# Bei mir sind das UI-Helfer. Hier stehen sie als Package, damit man sie in einem Rutsch bekommt:
#   configuration.yaml:  homeassistant:
#                          packages: !include_dir_named packages
#   diese Datei nach packages/ legen. Alternativ in der UI mit denselben Namen anlegen (die
#   Entity-IDs ergeben sich aus den Namen bzw. den Schlüsseln unten).
# Die Werte in den Kommentaren sind meine Einstellungen (zwei Sungrow SH10RT).

input_boolean:
  # Merker: wer hat Laden/Halten ausgelöst? Die Automationen beenden nur, was sie selbst gestartet haben.
  netzladen_durch_automatik:
    name: Netzladen durch Automatik
    icon: mdi:robot
  akku_halten_durch_plan:
    name: Akku halten durch Plan
    icon: mdi:battery-lock
  wr1_vor_netzladen_akku_halten:
    name: "WR1 vor Netzladen: Akku halten"
    icon: mdi:battery-lock
  wr2_vor_netzladen_akku_halten:
    name: "WR2 vor Netzladen: Akku halten"
    icon: mdi:battery-lock
  # nur für die Preis-Automatik
  preis_automatik:
    name: Preis-Automatik
    icon: mdi:robot
  akku_halten_pause_fur_pv_uberschuss:
    name: "Akku halten: Pause für PV-Überschuss"
    icon: mdi:solar-power-variant

input_number:
  ladebudget_gesamt:          # Netzbezug gesamt beim Zwangsladen, inkl. Haus und Auto - bei mir 18000 W
    name: Ladebudget gesamt
    min: 3000
    max: 20000
    step: 500
    mode: box
    unit_of_measurement: W
    icon: mdi:transmission-tower-import
  netz_phasengrenze:          # höchster Strom je Phase am Netzzähler - bei mir 25 A
    name: Netz Phasengrenze
    min: 16
    max: 32
    step: 1
    mode: box
    unit_of_measurement: A
    icon: mdi:fuse
  zwangsladen_leistung:       # höchste Ladeleistung je Akku - bei mir 8000 W
    name: Zwangsladen Leistung
    min: 500
    max: 10600
    step: 100
    mode: box
    unit_of_measurement: W
    icon: mdi:battery-charging-high
  zwangsladen_ziel_soc:       # Ziel-SoC fürs Zwangsladen (die Preis-Automatik setzt ihn selbst)
    name: Zwangsladen Ziel-SoC
    min: 20
    max: 100
    step: 5
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery-arrow-up
  backup_reserve_wr1:         # Notstrom-Reserve von WR1 (Register 13100) - bei mir 10 %
    name: Backup-Reserve WR1
    min: 0
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:battery-lock-open

template:
  - sensor:
      # Betriebsart je Wechselrichter in Klartext - die Automationen fragen nur diese Sensoren ab
      - name: WR1 Akku-Modus
        unique_id: wr1_akku_modus
        state: >-
          {%- set ems = states('sensor.ems_mode_selection') -%}
          {%- set cmd = states('sensor.battery_forced_charge_discharge_cmd') -%}
          {%- if ems == 'Self-consumption mode (default)' -%} Normalbetrieb
          {%- elif ems == 'Forced mode' and cmd == 'Forced charge' -%} Zwangsladen
          {%- elif ems == 'Forced mode' and cmd == 'Stop (default)' -%} Akku halten
          {%- elif ems == 'Forced mode' and cmd == 'Forced discharge' -%} Zwangsentladen
          {%- else -%} unbekannt
          {%- endif -%}
      - name: WR2 Akku-Modus
        unique_id: wr2_akku_modus
        state: >-
          {%- set ems = states('sensor.wr2_ems_mode_selection') -%}
          {%- set cmd = states('sensor.wr2_battery_forced_charge_discharge_cmd') -%}
          {%- if ems == 'Self-consumption mode (default)' -%} Normalbetrieb
          {%- elif ems == 'Forced mode' and cmd == 'Forced charge' -%} Zwangsladen
          {%- elif ems == 'Forced mode' and cmd == 'Stop (default)' -%} Akku halten
          {%- elif ems == 'Forced mode' and cmd == 'Forced discharge' -%} Zwangsentladen
          {%- else -%} unbekannt
          {%- endif -%}
      # stärkste Phase am Netzzähler (WR1) in A, für Phasengrenze und Notbremse
      - name: Netz max Phasenstrom
        unique_id: netz_max_phasenstrom
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: >-
          {{ ([states('sensor.meter_phase_a_active_power') | float(0), states('sensor.meter_phase_b_active_power') | float(0),
               states('sensor.meter_phase_c_active_power') | float(0)] | max / 230) | round(1) }}
