# Home Assistant Sungrow inverter integration
# https://github.com/mkaiser/Sungrow-SHx-Inverter-Modbus-Home-Assistant
# by Martin Kaiser
# original version: 2023-12-31
#
# Note: This YAML file will only work with Home Assistant >= 2023.10
#
# >>> NEWER VERSIONS AVAILABLE <<<
# This file is based on the original version of 2023-12-31. The original author keeps maintaining it;
# newer versions (as of 11/2026: release 2026-06-19, with a migration guide) are available at
#   https://github.com/mkaiser/Sungrow-SHx-Inverter-Modbus-Home-Assistant
# For a new installation, start with the current original there.
#
# Modified by https://github.com/NobseVomBerg/
#   - two inverters: entity names prefixed with "WR1 " (the second one: modbus_sungrow_wr2.yaml)
#   - control part of the original removed (input_number/input_select helpers, automations and
#     scripts); the battery modes are switched by own scripts instead
#   - yearly sensors 2019-2022 removed; the yearly totals are summed from the monthly sensors
#   - longer scan_interval for 64 sensors (less Modbus load)
#   - fixes: total backup power read as int32 (reg 5726-5727, word swap), battery capacity from
#     input register 5638 instead of holding register 33048, device_class in lower case
#
# Copyright (c) 2025 Martin Kaiser - MIT License, see LICENSE-mkaiser in this folder.
# Modifications: Copyright (c) 2026 NobseVomBerg - MIT License.

modbus:
  - name: WR1 SungrowSHx
    type: tcp
    host: !secret sungrow_modbus_host_ip
    port: !secret sungrow_modbus_port
    sensors:
      - name: WR1 Sungrow device type code
        unique_id: sg_dev_code
        device_address: !secret sungrow_modbus_slave
        address: 4999 # reg 5000
        input_type: input
        data_type: uint16
        scan_interval: 600

      - name: WR1 Daily PV generation & battery discharge
        unique_id: sg_daily_pv_gen_battery_discharge
        device_address: !secret sungrow_modbus_slave
        address: 5002 # reg 5003
        input_type: input
        data_type: uint16
        precision: 1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        scale: 0.1
        scan_interval: 600

      - name: WR1 Total PV generation & battery discharge
        unique_id: sg_total_pv_gen_battery_discharge
        device_address: !secret sungrow_modbus_slave
        address: 5003 # reg 5004
        input_type: input
        data_type: uint32
        swap: word
        unit_of_measurement: kWh
        precision: 1
        device_class: energy
        state_class: total
        scale: 0.1
        scan_interval: 600

      - name: WR1 Inverter temperature
        unique_id: sg_inverter_temperature
        device_address: !secret sungrow_modbus_slave
        address: 5007 # reg 5008
        input_type: input
        data_type: int16
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement
        scale: 0.1
        scan_interval: 10

      - name: WR1 MPPT1 voltage
        unique_id: sg_mppt1_voltage
        device_address: !secret sungrow_modbus_slave
        address: 5010 # reg 5011
        input_type: input
        data_type: uint16
        precision: 1
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scale: 0.1
        scan_interval: 10

      - name: WR1 MPPT1 current
        unique_id: sg_mppt1_current
        device_address: !secret sungrow_modbus_slave
        address: 5011 # reg 5012
        input_type: input
        data_type: uint16
        precision: 2
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        scale: 0.1
        scan_interval: 10

      - name: WR1 MPPT2 voltage
        unique_id: sg_mppt2_voltage
        device_address: !secret sungrow_modbus_slave
        address: 5012 # reg 5013
        input_type: input
        data_type: uint16
        precision: 1
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scale: 0.1
        scan_interval: 10

      - name: WR1 MPPT2 current
        unique_id: sg_mppt2_current
        device_address: !secret sungrow_modbus_slave
        address: 5013 # reg 5014
        input_type: input
        data_type: uint16
        precision: 2
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        scale: 0.1
        scan_interval: 10

      - name: WR1 Total DC power
        unique_id: sg_total_dc_power
        device_address: !secret sungrow_modbus_slave
        address: 5016 # reg 5017
        input_type: input
        data_type: uint32
        swap: word
        precision: 0
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scale: 1
        scan_interval: 10

      - name: WR1 Phase A voltage
        unique_id: sg_phase_a_voltage
        device_address: !secret sungrow_modbus_slave
        address: 5018 # reg: 5019
        input_type: input
        data_type: uint16
        precision: 1
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scale: 0.1
        scan_interval: 30

      - name: WR1 Phase B voltage
        unique_id: sg_phase_b_voltage
        device_address: !secret sungrow_modbus_slave
        address: 5019 # reg: 5020
        input_type: input
        data_type: uint16
        precision: 1
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scale: 0.1
        scan_interval: 30

      - name: WR1 Phase C voltage
        unique_id: sg_phase_c_voltage
        device_address: !secret sungrow_modbus_slave
        address: 5020 # reg: 5021
        input_type: input
        data_type: uint16
        precision: 1
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scale: 0.1
        scan_interval: 30

      - name: WR1 Grid frequency
        unique_id: sg_grid_frequency
        device_address: !secret sungrow_modbus_slave
        address: 5035 # reg 5036
        input_type: input
        data_type: uint16
        precision: 2
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
        scale: 0.1
        scan_interval: 60

      - name: WR1 Reactive power
        unique_id: sg_reactive_power
        device_address: !secret sungrow_modbus_slave
        address: 5032 # reg 5033
        input_type: input
        data_type: int32
        swap: word
        precision: 0
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scale: 1
        scan_interval: 10

      - name: WR1 Power factor
        unique_id: sg_power_factor
        device_address: !secret sungrow_modbus_slave
        address: 5034 # reg 5035
        input_type: input
        data_type: int16
        precision: 3
        unit_of_measurement: "%"
        device_class: power_factor
        state_class: measurement
        scale: 0.001
        scan_interval: 10

      #https://www.photovoltaikforum.com/thread/166134-daten-lesen-vom-sungrow-wechselrichtern-modbus/?pageNo=13
      #Meter Active Power: 5601-5602 S32 W (Energiezähler Wirkleistung)
      #Meter Phase A Active Power: 5603-5604 S32 W (Stromzähler Phase A Wirkleistung)
      #Meter Phase B Active Power: 5605-5606 S32 W (Stromzähler Phase B Wirkleistung)
      #Meter Phase C Active Power: 5607-5608 S32 W (Stromzähler Phase C Wirkleistung)
      - name: WR1 Meter active power raw
        unique_id: sg_meter_active_power_raw
        device_address: !secret sungrow_modbus_slave
        address: 5600 # reg 5601
        input_type: input
        data_type: int32
        swap: word
        precision: 0
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scale: 1
        scan_interval: 10

      - name: WR1 Meter phase A active power raw
        unique_id: sg_meter_phase_a_active_power_raw
        device_address: !secret sungrow_modbus_slave
        address: 5602 # reg 5603
        input_type: input
        data_type: int32
        swap: word
        precision: 0
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scale: 1
        scan_interval: 15

      - name: WR1 Meter phase B active power raw
