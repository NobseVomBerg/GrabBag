        address: 5604 # reg 5605
        input_type: input
        data_type: int32
        swap: word
        precision: 0
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scale: 1
        scan_interval: 15

      - name: WR1 Meter phase C active power raw
        unique_id: sg_meter_phase_c_active_power_raw
        device_address: !secret sungrow_modbus_slave
        address: 5606 # reg 5607
        input_type: input
        data_type: int32
        swap: word
        precision: 0
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scale: 1
        scan_interval: 15

      - name: WR1 BDC rated power
        unique_id: sg_bdc_rated_power
        device_address: !secret sungrow_modbus_slave
        address: 5627 # reg 5628
        input_type: input
        data_type: uint16
        unit_of_measurement: "W"
